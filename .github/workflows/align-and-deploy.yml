# ─────────────────────────────────────────────────────────────────────────────
# align-and-deploy.yml
#
# Two-job pipeline:
#   1. align  — runs WhisperX forced alignment on ubuntu amd64 (CPU, no GPU)
#               using the tiny Whisper model (fast, alignment quality is not
#               affected because canonical text is the input, not the ASR output)
#               then commits updated data/output/*.json back to the repo.
#
#   2. deploy — uses `az acr build` (cloud build, no Docker in CI) to rebuild
#               the Flask image with the fresh JSONs baked in, then calls
#               `az containerapp update` to go live.
#
# ONE-TIME SETUP — run locally once, then add three GitHub secrets:
#
#   # 1. Get tenant + subscription IDs
#   az account show --query "{tenantId:tenantId, subscriptionId:id}" -o json
#
#   # 2. Create app registration
#   az ad app create --display-name "github-quranidx"
#   # → note the appId from the output
#
#   # 3. Create service principal
#   az ad sp create --id <appId>
#   # → note the id (object ID) from the output
#
#   # 4. Grant Contributor role
#   az role assignment create \
#     --assignee <appId> \
#     --role Contributor \
#     --scope /subscriptions/3e89416f-3804-457e-8ec5-8c692669fde6
#
#   # 5. Add federated credential (replace ORG/REPO with your GitHub repo)
#   az ad app federated-credential create --id <appId> --parameters '{
#     "name": "github-main",
#     "issuer": "https://token.actions.githubusercontent.com",
#     "subject": "repo:odulkuyulu/quran-indexing:ref:refs/heads/main",
#     "audiences": ["api://AzureADTokenExchange"]
#   }'
#
#   # 6. Add three GitHub secrets (repo → Settings → Secrets → Actions):
#   #   AZURE_CLIENT_ID       ← appId from step 2
#   #   AZURE_TENANT_ID       ← tenantId from step 1
#   #   AZURE_SUBSCRIPTION_ID ← subscriptionId from step 1
# ─────────────────────────────────────────────────────────────────────────────

name: Align & Deploy

on:
  # Manual trigger with customisable surah list
  workflow_dispatch:
    inputs:
      surahs:
        description: "Space-separated surah numbers to align"
        default: "1 112 114"
        required: true

  # Auto-trigger on pipeline code or app changes
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/seed_demo.py"
      - "app/**"
      - "Dockerfile"
      - "requirements*.txt"

permissions:
  contents: write   # push alignment output back to repo
  id-token: write   # OIDC — lets GitHub get an Azure token without a stored secret

# ── Shared resource names (not sensitive — hardcoded for simplicity) ──────────
env:
  ACR_NAME:            cryj5rva4yxmga2
  CONTAINER_APP_NAME:  ca-quranidx-yj5rva4yxmga2
  RESOURCE_GROUP:      rg-quranidx-dev

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── Job 1: Forced Alignment ─────────────────────────────────────────────────
  align:
    name: WhisperX alignment (CPU)
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.push.outputs.changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need parent commit to detect changed files

      # Detect early — skip 10+ min of ML setup for app/infra-only pushes
      - name: Detect whether alignment is needed
        id: need_align
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD~1 HEAD 2>/dev/null \
               | grep -qE '^(src/|scripts/seed_demo\.py)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.need_align.outputs.run == 'true'
        with:
          python-version: "3.11"

      # Cache pip packages so reinstalls are fast after the first run
      - name: Cache pip
        if: steps.need_align.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pipeline-py311-${{ hashFiles('requirements.txt') }}
          restore-keys: pipeline-py311-

      # Cache HuggingFace model weights (~1.5 GB total for tiny + wav2vec2-arabic)
      - name: Cache HuggingFace models
        if: steps.need_align.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-tiny-wav2vec2-arabic-v1

      - name: Free up runner disk space
        if: steps.need_align.outputs.run == 'true'
        run: |
          # Remove large pre-installed tool chains not needed for alignment
          sudo rm -rf /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      /opt/hostedtoolcache/Ruby \
                      /opt/hostedtoolcache/go \
                      /usr/share/dotnet \
                      /usr/local/share/boost
          sudo apt-get clean
          df -h   # log available space for debugging

      - name: Install system packages
        if: steps.need_align.outputs.run == 'true'
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python packages (CPU torch)
        if: steps.need_align.outputs.run == 'true'
        run: |
          # CPU-only PyTorch — ~220 MB, avoids pulling CUDA wheels
          # --no-cache-dir keeps disk use to installed size only
          pip install --no-cache-dir torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir faster-whisper openai-whisper
          pip install --no-cache-dir "whisperx @ git+https://github.com/m-bain/whisperX.git"
          # Remaining pipeline deps (excludes flask/gunicorn — not needed here)
          pip install --no-cache-dir python-dotenv requests httpx rich tqdm \
                      arabic-reshaper python-bidi jiwer \
                      pydub librosa soundfile ffmpeg-python \
                      azure-search-documents azure-identity

      - name: Run forced alignment
        if: steps.need_align.outputs.run == 'true'
        env:
          WHISPER_MODEL: tiny   # tiny = 74 MB, fast on CPU; alignment accuracy
                                # unaffected since canonical text is the anchor
          AUDIO_DIR:    ./data/audio
          OUTPUT_DIR:   ./data/output
          # mp3quran.net uses short reciter codes; "afs" = Mishary Rashid Alafasy
          AUDIO_SOURCE_PATTERN: "https://server8.mp3quran.net/afs/{surah:03d}.mp3"
          SURAHS: ${{ github.event.inputs.surahs || '1 112 114' }}
          # Azure AI Search — upload aligned ayahs to the search index after alignment
          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}
          AZURE_SEARCH_KEY:      ${{ secrets.AZURE_SEARCH_KEY }}
          AZURE_SEARCH_INDEX:    quran-ayah-index
        run: |
          mkdir -p data/audio/raw data/audio/normalized data/output
          for surah in $SURAHS; do
            echo "──────────────────────────────────────────"
            echo "  Aligning Surah $surah"
            echo "──────────────────────────────────────────"
            python -m src.pipeline --surah "$surah" --reciter mishary_alafasy --upload
          done

      - name: Run Azure AI enrichment (Speech + Content Understanding)
        if: steps.need_align.outputs.run == 'true'
        env:
          AZURE_AI_ENDPOINT: ${{ secrets.AZURE_AI_ENDPOINT }}
          AZURE_AI_KEY:      ${{ secrets.AZURE_AI_KEY }}
          AZURE_SPEECH_REGION: westeurope
          OUTPUT_DIR: ./data/output
          SURAHS: ${{ github.event.inputs.surahs || '1 112 114' }}
        run: |
          if [ -z "$AZURE_AI_KEY" ]; then
            echo "AZURE_AI_KEY not set — skipping Azure AI enrichment (demo will use synthetic data)"
            exit 0
          fi
          echo "── Azure AI Content Understanding ──────────────────────"
          python scripts/run_azure_cu.py --setup-analyzer || echo "Analyzer setup failed — continuing"
          for surah in $SURAHS; do
            python scripts/run_azure_cu.py --surah "$surah" \
              || echo "CU failed for surah $surah — synthetic fallback will be used"
          done
          echo "── Azure Speech Transcription ──────────────────────────"
          for surah in $SURAHS; do
            python scripts/run_azure_speech.py --surah "$surah" \
              || echo "Speech failed for surah $surah — synthetic fallback will be used"
          done

      - name: Commit & push alignment output
        id: push
        env:
          SURAHS: ${{ github.event.inputs.surahs || '1 112 114' }}
        run: |
          # App-only push (no alignment ran) — still needs a deploy
          if [ "${{ steps.need_align.outputs.run }}" = "false" ]; then
            echo "App/infra-only push — no alignment needed, but deploying new image."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/output/
          if git diff --staged --quiet; then
            echo "No alignment changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update alignment output [skip ci]"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Job 2: Rebuild image & deploy to ACA ──────────────────────────────────
  deploy:
    name: Build image & deploy to ACA
    needs: align
    # Runs when alignment produced new files OR on manual dispatch (always deploy)
    if: needs.align.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      # Checkout the HEAD of main so we pick up the freshly committed JSONs
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Azure login (OIDC — no stored secret)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # az acr build runs the Docker build entirely inside Azure —
      # no Docker daemon needed on the runner, and the image is pushed
      # directly to ACR. Much faster than building locally and pushing.
      - name: Build & push image via ACR Tasks
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image  "quranidx/web:${{ github.sha }}" \
            --image  "quranidx/web:latest" \
            .

      - name: Update Container App
        run: |
          az containerapp update \
            --name           "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image          "$ACR_NAME.azurecr.io/quranidx/web:${{ github.sha }}" \
            --set-env-vars \
              "AZURE_SEARCH_ENDPOINT=${{ secrets.AZURE_SEARCH_ENDPOINT }}" \
              "AZURE_SEARCH_KEY=${{ secrets.AZURE_SEARCH_KEY }}" \
              "AZURE_SEARCH_INDEX=quran-ayah-index" \
              "AZURE_AI_ENDPOINT=${{ secrets.AZURE_AI_ENDPOINT }}" \
              "AZURE_AI_KEY=${{ secrets.AZURE_AI_KEY }}" \
              "AZURE_SPEECH_REGION=westeurope"

      - name: Print live URL
        run: |
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          echo "✅ Live at: https://$FQDN"
